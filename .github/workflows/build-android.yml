name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --org com.glassgram --project-name glassgram --platforms android .
          rm -rf test

      - name: Download Inter font (SF Pro-style, SIL OFL)
        run: |
          mkdir -p assets/fonts /tmp/inter
          curl -fsSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip
          unzip -q /tmp/inter.zip -d /tmp/inter
          for w in Regular Medium SemiBold Bold; do
            f=$(find /tmp/inter -name "Inter-$w.ttf" | head -1)
            [ -n "$f" ] || { echo "::error::Inter-$w.ttf not found"; exit 1; }
            cp "$f" assets/fonts/
          done

      - name: Write .env from secrets
        run: |
          printf 'API_ID=%s\nAPI_HASH=%s\n' "${{ secrets.API_ID }}" "${{ secrets.API_HASH }}" > .env

      - run: flutter pub get

      - name: Patch old tdlib plugin for new Android Gradle
        run: |
          D=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name 'tdlib-*' | head -1)
          G="$D/android/build.gradle"
          PKG=$(grep -oP 'package="\K[^"]+' "$D/android/src/main/AndroidManifest.xml" || echo com.tdlib.plugin)
          grep -q namespace "$G" || sed -i "0,/android {/s//android {\n    namespace \"$PKG\"/" "$G"
          sed -i -E 's/compileSdk(Version)?[ =]+[0-9]+/compileSdk 36/' "$G"
          sed -i -E 's/minSdk(Version)?[ =]+[0-9]+/minSdk 24/' "$G"
          cat "$G"
          echo "patched $G with namespace $PKG"

      - name: Analyze (report errors)
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1 || true
          grep -E "error •" analyze.log | head -25 | while read -r l; do echo "::error::$l"; done

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || {
            grep -E "What went wrong|Execution failed|error:|Could not" -A6 build.log | head -45 | while read -r l; do echo "::error::$l"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: glassgram-apk
          path: build/app/outputs/flutter-apk/app-release.apk
