name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --org com.glassgram --project-name glassgram --platforms android .
          rm -rf test

      - name: Write .env from secrets
        run: |
          printf 'API_ID=%s\nAPI_HASH=%s\n' "${{ secrets.API_ID }}" "${{ secrets.API_HASH }}" > .env

      - run: flutter pub get

      - name: Analyze (report errors)
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1 || true
          grep -E "error •" analyze.log | head -25 | while read -r l; do echo "::error::$l"; done

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || {
            grep -E "Error|error:|FAILURE|What went wrong|Could not" -A1 build.log | head -30 | while read -r l; do echo "::error::$l"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: glassgram-apk
          path: build/app/outputs/flutter-apk/app-release.apk
